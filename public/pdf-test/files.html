<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>NimBooks download test</title>
<link rel="stylesheet" href="probe.css">
</head><body>
<h1>Download test</h1>
<p id="env" class="muted"></p>
<div id="openInPay" hidden class="card warn">
  <p>This test must run <b>inside Nimiq Pay</b>.</p>
  <a class="btn" id="payLink" href="#">Open this page in Nimiq Pay</a>
</div>
<p class="muted">Tap each <b>Try</b>, then check what happened. For the file tests, look for a download notice, or open your <b>My Files</b> app and check <b>Downloads</b> for <code>nimbooks-test.csv</code>. Then tap the matching answer. Finish with <b>Send results</b>.</p>
<div id="tests"></div>
<div class="card">
  <button class="btn" id="send">Send results</button>
  <p id="sent" class="muted"></p>
  <details><summary>Log</summary><pre id="log"></pre></details>
  <button class="link" id="reset">Clear answers</button>
</div>
<script src="files.js"></script>
</body></html>
