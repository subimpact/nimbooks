<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>NimBooks PDF test</title>
<link rel="stylesheet" href="probe.css">
</head><body>
<h1>PDF test</h1>
<p id="env" class="muted"></p>
<div id="openInPay" hidden class="card warn">
  <p>This test must run <b>inside Nimiq Pay</b>.</p>
  <a class="btn" id="payLink" href="#">Open this page in Nimiq Pay</a>
</div>
<p class="muted">Tap each <b>Try</b>, see what happens, then tap the answer that matches. Your answers are saved as you go. Finish with <b>Send results</b> at the bottom.</p>
<div id="tests"></div>
<div class="card">
  <button class="btn" id="send">Send results</button>
  <p id="sent" class="muted"></p>
  <details><summary>Log</summary><pre id="log"></pre></details>
  <button class="link" id="reset">Clear answers</button>
</div>
<script src="probe.js"></script>
</body></html>
